<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      font-family: sans-serif;
      width: 260px;
      padding: 14px;
      margin: 0;
    }
    label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      cursor: pointer;
    }
    p {
      font-size: 11px;
      color: #666;
      margin: 8px 0 0;
    }
  </style>
</head>
<body>
  <label>
    <input type="checkbox" id="autoActive">
    Always remove overlays automatically
  </label>
  <p>When on, overlays are removed as soon as any page loads or changes, on every site, with no click needed. When off, click the toolbar button (or press Ctrl+Shift+X) to remove overlays manually, as before.</p>
  <script src="js/options.js"></script>
</body>
</html>
